<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Сардаковський Денис, ІК-44, Лабораторна 2, Варіант 24, HTML5, CSS3, таблиці, трансформації"
    />
    <meta
      name="description"
      content="Лабораторна робота №2 з дисципліни Основи Front-end технологій. Таблиці в HTML-5 та трансформації в CSS-3."
    />
    <title>Сардаковський Д.О. Група ІК-44 Лаб№2 Вар№24</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Стилі до Завдання 1 (згідно з умовою розміщені у цьому ж файлі) */
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        background-color: #ffffff;
        color: #000000;
      }

      .info-table {
        width: 100%;
        max-width: 850px;
        border-collapse: collapse;
        margin-bottom: 40px;
        font-size: 18px;
        table-layout: fixed;
      }

      .info-table td {
        border: 2px solid #000000;
        padding: 10px 14px;
        height: 32px;
        vertical-align: middle;
      }

      /* Ширина віртуальних стовпців відповідно до пропорцій Варіанту 4 */
      .col-small {
        width: 11%;
      }

      .col-wide {
        width: 26%;
      }

      /* 1-й рядок: #nn8f8f (де nn = 24) + контрастний білий колір тексту */
      .row-first {
        background-color: #248f8f;
        color: #ffffff;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      /* 2-й рядок: #f5f5nn (де nn = 24) + контрастний темний колір тексту */
      .row-second {
        background-color: #f5f524;
        color: #1a1a24;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      /* 3-й рядок: порожній (білий фон) */
      .row-third {
        background-color: #ffffff;
      }

      /* Зміна кольорів 1-го та 2-го рядків на протилежні при наведенні курсора */
      .row-first:hover {
        background-color: #f5f524;
        color: #1a1a24;
      }

      .row-second:hover {
        background-color: #248f8f;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>Лабораторна робота №2</h1>

    <h2>Завдання 1. Таблиця (Варіант 24 / Макет 4)</h2>
    <table class="info-table">
      <tbody>
        <!-- 1-й рядок: дві порожні комірки + ПІБ виконавця окремо в кожну комірку -->
        <tr class="row-first">
          <td class="col-small"></td>
          <td class="col-small"></td>
          <td class="col-wide" rowspan="2">Сардаковський</td>
          <td class="col-wide">Денис</td>
          <td class="col-wide" rowspan="2">Олександрович</td>
        </tr>
        <!-- 2-й рядок: послідовно група, номер лабораторної роботи та номер варіанту -->
        <tr class="row-second">
          <td colspan="2">ІК-44</td>
          <td>ЛР-2 Варіант 24</td>
        </tr>
        <!-- 3-й рядок: нижній ряд порожніх об'єднаних комірок за схемою -->
        <tr class="row-third">
          <td colspan="2"></td>
          <td colspan="3"></td>
        </tr>
      </tbody>
    </table>

    <h2>Завдання 2. Зображення засобами CSS-3 (Position та Transform)</h2>
    <div class="figures-container">
      <!-- 1. Побудова за допомогою position -->
      <div class="figure-card">
        <h3>1. За допомогою position</h3>
        <div class="target-position">
          <div class="pos-ring"></div>
          <div class="pos-circle"></div>
          <div class="pos-line-h"></div>
          <div class="pos-line-v"></div>
        </div>
      </div>

      <!-- 2. Побудова за допомогою transform -->
      <div class="figure-card">
        <h3>2. За допомогою transform</h3>
        <div class="target-transform">
          <div class="tr-ring"></div>
          <div class="tr-circle"></div>
          <div class="tr-line-h"></div>
          <div class="tr-line-v"></div>
        </div>
      </div>
    </div>
  </body>
</html>
